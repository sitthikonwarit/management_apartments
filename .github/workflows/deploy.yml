name: Deploy to Ubuntu Server

on:
  push:
    branches:
      - main # ทำงานเมื่อมีการ push โค้ดเข้ากิ่ง main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # ทำให้ SSH รู้จักคำสั่ง bun
            export PATH="/root/.bun/bin:$PATH"
            
            # 1. ดึงโค้ดล่าสุดจาก GitHub
            cd /root/management_apartments
            git pull origin main
            
            # ========================================
            # 2. ส่วนอัปเดต Frontend (หน้าเว็บ)
            # ========================================
            cd /root/management_apartments/frontend
            bun install
            bun run build
            cp -r dist/* /var/www/management_apartments_frontend/
            systemctl restart nginx
            
            # ========================================
            # 3. ส่วนอัปเดต Backend (API)
            # ========================================
            cd /root/management_apartments/backend
            bun install